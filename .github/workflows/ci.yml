name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned release download with retries (the install script's API lookup is rate-limited on
      # shared runners and failed a run).
      - name: Install Rokit
        env:
          ROKIT_VERSION: "1.2.0"
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors -o rokit.zip \
            "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip"
          unzip -o rokit.zip -d rokit-bin
          ./rokit-bin/rokit self-install
          rm -rf rokit.zip rokit-bin
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          rokit install --no-trust-check

      - name: Install Wally packages
        run: wally install

      - name: Integrity checks (place file, strict mode, conflicts, Rojo paths, remotes)
        run: bash scripts/ci-checks.sh

      - name: Model contract on the place file (ACD-03)
        run: lune run scripts/validate-models.luau

      - name: StyLua (format check)
        run: stylua --check src tests tools

      - name: Selene (lint)
        run: selene src tests tools

      - name: Rojo build
        run: |
          mkdir -p build
          rojo build default.project.json -o build/Afterburner.rbxl
